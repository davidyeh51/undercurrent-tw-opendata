<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 下面這幾個標籤的內容，會由 Worker（handleGraphPage）換成這張圖自己的標題與說明，
     連結貼到 Threads／LINE／Facebook 時的預覽卡片才看得出是哪張圖。這裡寫的是
     找不到圖時的預設值。 -->
<title>UNDERCURRENT 關係圖</title>
<meta name="description" content="由公開的公司登記資料整理的公司與人物關係圖。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UNDERCURRENT">
<meta property="og:title" content="UNDERCURRENT 關係圖">
<meta property="og:description" content="由公開的公司登記資料整理的公司與人物關係圖。">
<meta property="og:url" content="https://undercurrent.kentshen.com/graph">
<!-- 縮圖：Worker 會換成這張圖自己的 /graph-image?t=...；舊的快照沒有縮圖，
     這三個標籤會被整組移除，避免平台抓到空的 og:image 顯示成破圖。 -->



<meta name="twitter:card" content="summary">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "cef2a87c55694b2b8d94f9f091c66973"}'></script><!-- End Cloudflare Web Analytics -->
<style>
  :root{
    --bg:#F3FAF9; --panel:#FFFFFF; --ink:#10262B; --ink-soft:#3E5C60; --muted:#7B928F;
    --line:#D3E6E3; --accent:#0E8C82; --warn-bg:#FFF7E8; --warn-line:#E8CF9E;
  }
  html.dark{
    --bg:#050B14; --panel:#0A1622; --ink:#DCEAF2; --ink-soft:#9FBBCB; --muted:#5C7A8C;
    --line:#1E3648; --accent:#3FE8D4; --warn-bg:#1C1A10; --warn-line:#4A3E1E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body{ display:flex; flex-direction:column; }
  header{ flex:none; padding:16px 20px 12px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:flex-start; gap:16px; }
  header .text{ flex:1; min-width:0; }
  .eyebrow{ font-size:12px; font-weight:700; color:var(--accent); margin-bottom:4px; }
  h1{ margin:0; font-size:19px; line-height:1.4; }
  .meta{ margin-top:4px; font-size:12.5px; color:var(--muted); }
  .cta{ flex:none; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none;
    border:1px solid var(--accent); border-radius:8px; padding:7px 12px; white-space:nowrap; }
  .cta:hover{ background:var(--accent); color:var(--panel); }
  #graph{ flex:1; min-height:320px; position:relative; }
  .hint{ position:absolute; left:12px; top:10px; font-size:12px; color:var(--muted); pointer-events:none; }
  .notice{ flex:none; padding:12px 20px 14px; border-top:1px solid var(--warn-line); background:var(--warn-bg);
    font-size:12.5px; line-height:1.75; color:var(--ink-soft); }
  .notice b{ color:var(--ink); }
  .notice a{ color:var(--accent); }
  .msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; font-size:15px; line-height:1.8; color:var(--ink-soft); }
  @media (max-width:640px){
    header{ flex-direction:column; gap:10px; padding:14px 16px 10px; }
    h1{ font-size:17px; }
    .notice{ padding:10px 16px 12px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-opendata-bridge.js"></script>
<script src="graph-view.js"></script>
</head>
<body>
<header>
  <div class="text">
    <div class="eyebrow">UNDERCURRENT 關係圖</div>
    <h1 id="title">載入中…</h1>
    <div class="meta" id="meta"></div>
  </div>
  <a class="cta" href="/">用 UNDERCURRENT 查詢更多公司 →</a>
</header>
<div id="graph">
  <div class="msg" id="msg">載入關係圖中…</div>
</div>
<div class="notice" id="notice" hidden>
  人物以姓名歸併，同名可能不是同一人。資料來源：<span id="source">經濟部商業司</span>
  · <a href="/embed-terms">使用條款</a>
</div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  if(params.get('theme') === 'dark') document.documentElement.classList.add('dark');

  const titleEl = document.getElementById('title');
  const metaEl = document.getElementById('meta');
  const msg = document.getElementById('msg');

  function fail(title, text){
    titleEl.textContent = title;
    msg.textContent = text;
  }

  if(!token){
    fail('連結不完整', '這個連結缺少關係圖的代碼，請確認連結有完整複製。');
    return;
  }

  (async () => {
    if(window.SupabaseBridge){
      const data = await window.SupabaseBridge.loadSnapshot(token);
      if(data){
        titleEl.textContent = data.title || '關係圖';
        metaEl.textContent = String(data.created_at || '').slice(0, 10) + ' 建立的快照・'
          + (data.node_count || (data.nodes || []).length) + ' 個節點・內容不會再變動';
        document.getElementById('source').textContent = data.source || '經濟部商業發展署 / Supabase';
        document.getElementById('notice').hidden = false;

        msg.remove();
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = '拖曳移動・滾輪縮放・點節點標出它的連線';
        const graph = document.getElementById('graph');
        window.UDCGraphView.mount(graph, data, {
          theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
          interactive: true,
        });
        graph.appendChild(hint);
        return;
      }
    }

    fetch('/api/graph-snapshots?t=' + token).then(async res => {
    const data = await res.json().catch(() => ({}));
    if(res.status === 410){ fail('關係圖已撤回', '這張關係圖已由建立者撤回。'); return; }
    if(res.status === 404){ fail('找不到關係圖', '找不到這張關係圖，可能是連結有誤。'); return; }
    if(!res.ok){ fail('暫時無法載入', '關係圖暫時無法載入，請稍後再試。'); return; }

    titleEl.textContent = data.title || '關係圖';
    metaEl.textContent = String(data.created_at || '').slice(0, 10) + ' 建立的快照・'
      + (data.node_count || 0) + ' 個節點・內容不會再變動';
    document.getElementById('source').textContent = data.source || '經濟部商業司';
    document.getElementById('notice').hidden = false;

    msg.remove();
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '拖曳移動・滾輪縮放・點節點標出它的連線';
    const graph = document.getElementById('graph');
    window.UDCGraphView.mount(graph, data, {
      theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
      interactive: true,
    });
    graph.appendChild(hint);
  }).catch(() => fail('暫時無法載入', '關係圖暫時無法載入，請稍後再試。'));
})();
})();
</script>
</body>
</html>
